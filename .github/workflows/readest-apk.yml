name: Build installable Readest APK (no login / DeepSeek V4.1 Flash)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy vendor bundles
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: create env files
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          cp .env.local apps/readest-app/.env.local
          cp .env.local apps/readest-app/.env.tauri

      - name: build debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          # Restores the tracked gradle customizations. It also reverts the
          # patch, so the patch is applied again below, from the repo root.
          git checkout .
          cd "$GITHUB_WORKSPACE"
          git apply .github/workflows/readest-deepseek.patch
          cd apps/readest-app
          # Debug keystore signing: no release secrets needed, APK installs
          # directly on a device. arm64 + armv7 covers virtually all phones.
          pnpm tauri android build --debug -t aarch64 -t armv7
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*universal*' -name '*debug.apk' -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' -print -quit)
          fi
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Readest-DeepSeek-V4.1Flash-debug.apk"

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-deepseek-apk
          path: Readest-DeepSeek-V4.1Flash-debug.apk
          if-no-files-found: error
